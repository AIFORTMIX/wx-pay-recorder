name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: wxpay2026
      KEY_ALIAS: release
      KEY_PASSWORD: wxpay2026

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/release.keystore" \
            -alias release \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=wx-pay-recorder, OU=dev, O=wxpayrecorder, L=CN, ST=CN, C=CN"
          echo "KEYSTORE_FILE=$HOME/release.keystore" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wx-pay-recorder
          path: app/build/outputs/apk/release/app-release.apk
